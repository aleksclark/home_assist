# Plan-03 project deployment contract (schema v1).
# Value-free. Secrets live only in Nomad Variables (paths listed below).
# Fleet reconciler should point project-home-assist at this manifest path:
#   services/minisplit-otel-poller/deploy/nomad/deployment.yaml
schema_version: 1
project: home-assist-minisplit
owner: aleks-clark
repository: https://github.com/aleksclark/home_assist
ref_policy: signed-default-branch-commit
namespace: default
datacenters: [home]
release_sets:
  - name: minisplit
    jobs:
      - id: minisplit-otel-poller
        spec: jobs/minisplit-otel-poller.nomad.hcl
    env: env/home.nomadvars.hcl
    images: images.lock.hcl
    variable_paths:
      - nomad/jobs/minisplit-otel-poller
    rollout: serial
    prune: explicit-only
