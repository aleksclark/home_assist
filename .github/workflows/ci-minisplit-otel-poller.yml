name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "services/minisplit-otel-poller/**"
      - ".github/workflows/ci-minisplit-otel-poller.yml"

jobs:
  minisplit-otel-poller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/minisplit-otel-poller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: services/minisplit-otel-poller/go.sum

      - name: Unit + observe-only tests
        run: go test ./... -count=1

      - name: Jobspec contract tests
        run: go test ./deploy/nomad/jobs -count=1

      - name: Vet
        run: go vet ./...
