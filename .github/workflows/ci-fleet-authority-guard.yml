# Fail-closed CI: no reintroduction of fleet Ansible/Nomad authority in home_assist.
#
# Least privilege: contents:read only on this public repo. SHA-pinned actions.
# Private sibling fleet-iac is materialized via repository secret
# FLEET_IAC_READ_TOKEN (read-only fine-grained PAT or deploy key equivalent).
# GITHUB_TOKEN cannot read private aleksclark/fleet-iac from this public repo.
#
# Merge-order gate (canonical fleet-iac commit on origin/master) is a hard
# fleet-first release/merge prerequisite on pull_request AND push to master.
# No soft/advisory path: both must fail closed until canonical is on mainline.

name: fleet-authority-guard

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "fleet/**"
      - "tools/fleet_authority_guard/**"
      - "tests/fleet_authority/**"
      - ".github/workflows/ci-fleet-authority-guard.yml"

concurrency:
  group: fleet-authority-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Fleet authority retirement guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require FLEET_IAC_READ_TOKEN for private fleet-iac
        # Fail-closed preflight: hosted GITHUB_TOKEN cannot read private fleet-iac.
        # Do not echo or print the secret value.
        env:
          FLEET_IAC_READ_TOKEN: ${{ secrets.FLEET_IAC_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLEET_IAC_READ_TOKEN:-}" ]; then
            echo "::error::FLEET_IAC_READ_TOKEN secret is required but missing/empty."
            echo "home_assist is public; aleksclark/fleet-iac is private."
            echo "GITHUB_TOKEN cannot read the sibling private repo."
            echo "Configure a repository secret FLEET_IAC_READ_TOKEN with a read-only"
            echo "fine-grained PAT (contents:read on aleksclark/fleet-iac) or equivalent"
            echo "deploy credential. See AGENTS.md and fleet/README.md."
            exit 1
          fi
          echo "FLEET_IAC_READ_TOKEN is present (value not shown)."

      - name: Checkout private fleet-iac (canonical)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: aleksclark/fleet-iac
          path: fleet-iac-canonical
          fetch-depth: 0
          token: ${{ secrets.FLEET_IAC_READ_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fail-closed path guard
        run: python3 tools/fleet_authority_guard/check_no_fleet_authority.py --root .

      - name: Resolve and require manifest source_commit
        id: provenance
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("fleet/MIGRATION_MANIFEST.json").read_text(encoding="utf-8"))
          c = data.get("source_commit")
          if not isinstance(c, str) or len(c) != 40:
              raise SystemExit(f"invalid source_commit: {c!r}")
          print(c)
          PY
          )"
          echo "source_commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          # Fail-hard: require the exact pre-migration object (no || true).
          git cat-file -t "${SOURCE_COMMIT}"
          git rev-parse --verify "${SOURCE_COMMIT}^{commit}"

      - name: Retirement contract tests
        env:
          # Prefer exact source_commit; tests also fall back to manifest pin when
          # BASE_REF is HEAD/origin/master/master (post-merge tips).
          FLEET_AUTHORITY_BASE_REF: ${{ steps.provenance.outputs.source_commit }}
        run: |
          set -euo pipefail
          # tests/fleet_authority/test_fleet_authority_retirement.py
          python3 -m unittest discover -s tests/fleet_authority -p 'test_*.py' -v

      - name: Merge-order fleet-first gate (fail-closed)
        # Hard fail on PR and master until canonical is ancestor of fleet-iac origin/master.
        # release-prerequisite / merge-prerequisite: no soft path.
        run: |
          set -euo pipefail
          # Ensure origin/master exists on the materialized private checkout.
          git -C fleet-iac-canonical rev-parse --verify origin/master
          python3 tools/fleet_authority_guard/check_fleet_iac_merge_order.py \
            --root . \
            --fleet-iac fleet-iac-canonical \
            --mainline-ref origin/master
