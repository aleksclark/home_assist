# Fail-closed CI: no reintroduction of fleet Ansible/Nomad authority in home_assist.
#
# Least privilege: contents:read only. No repository secrets, no id-token,
# no write permissions. SHA-pinned actions.
#
# Merge-order gate (canonical fleet-iac commit on mainline) is a
# release/merge prerequisite. On pull_request it runs report-only (--soft)
# so the retirement branch CI stays green while fleet-iac remains unmerged.
# On push to master it runs fail-closed.

name: fleet-authority-guard

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "fleet/**"
      - "tools/fleet_authority_guard/**"
      - "tests/fleet_authority/**"
      - ".github/workflows/ci-fleet-authority-guard.yml"

concurrency:
  group: fleet-authority-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Fleet authority retirement guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fail-closed path guard
        run: python3 tools/fleet_authority_guard/check_no_fleet_authority.py --root .

      - name: Resolve and require manifest source_commit
        id: provenance
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("fleet/MIGRATION_MANIFEST.json").read_text(encoding="utf-8"))
          c = data.get("source_commit")
          if not isinstance(c, str) or len(c) != 40:
              raise SystemExit(f"invalid source_commit: {c!r}")
          print(c)
          PY
          )"
          echo "source_commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          # Fail-hard: require the exact pre-migration object (no || true).
          git cat-file -t "${SOURCE_COMMIT}"
          git rev-parse --verify "${SOURCE_COMMIT}^{commit}"

      - name: Retirement contract tests
        env:
          # Prefer exact source_commit; tests also fall back to manifest pin when
          # BASE_REF is HEAD/origin/master/master (post-merge tips).
          FLEET_AUTHORITY_BASE_REF: ${{ steps.provenance.outputs.source_commit }}
        run: |
          set -euo pipefail
          # tests/fleet_authority/test_fleet_authority_retirement.py
          python3 -m unittest discover -s tests/fleet_authority -p 'test_*.py' -v

      - name: Merge-order release prerequisite (soft on PR)
        # release-prerequisite / merge-prerequisite: fail-closed only on master push.
        # Branch unit CI must not hard-fail while fleet-iac PR is intentionally unmerged.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          FLEET_IAC_REPO: ${{ vars.FLEET_IAC_REPO || '' }}
        run: |
          set -euo pipefail
          python3 tools/fleet_authority_guard/check_fleet_iac_merge_order.py \
            --root . \
            --soft \
            --report-only \
            --mainline-ref origin/master
          # Explicit soft/report-only path for PR branch CI (merge-order pending is OK).

      - name: Merge-order release prerequisite (fail-closed on master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          FLEET_IAC_REPO: ${{ vars.FLEET_IAC_REPO || '' }}
        run: |
          set -euo pipefail
          # Fail-closed merge-ready gate once this lands on master.
          python3 tools/fleet_authority_guard/check_fleet_iac_merge_order.py \
            --root . \
            --mainline-ref origin/master
