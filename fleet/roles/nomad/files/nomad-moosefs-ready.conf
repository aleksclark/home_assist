[Unit]
RequiresMountsFor=/mnt/moosefs
After=network-online.target remote-fs.target

[Service]
# mfsdelayedinit can mark the FUSE mount active before the MooseFS master is
# reachable. Do not let Nomad validate host volumes or start allocations until
# the mounted configs directory can actually be statted without EIO.
ExecStartPre=/usr/bin/bash -c 'n=0; until /usr/bin/mountpoint -q /mnt/moosefs && /usr/bin/timeout 5 /usr/bin/stat /mnt/moosefs/configs >/dev/null 2>&1; do n=$((n + 1)); if [ "$n" -ge 150 ]; then echo "MooseFS did not become ready within 5 minutes" >&2; exit 1; fi; /usr/bin/sleep 2; done'
